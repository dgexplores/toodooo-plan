name: CI

on:
  push:
    branches: [main, 'release/**', 'codebase', 'improve/**']
  pull_request:
    branches: [main, 'release/**', 'codebase', 'improve/**']

jobs:
  typecheck:
    name: Typecheck
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (node + web)
        run: npm run typecheck
      # Release gate: every advertised download link and docs version string must
      # match package.json. A version left behind in RELEASE.md / docs turns the
      # download buttons into 404s the moment the next release ships — this catches
      # it on the release branch, before a tag, instead of on launch day.
      # Release gate: only meaningful on main/release branches. Improvement
      # branches carry upstream's in-flight version drift (docs ahead of
      # package.json); gating them here would red every feature branch.
      - name: Release links consistent
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        run: npm run check:links

  build:
    name: Build
    runs-on: macos-latest
    # Build exercises the native node-pty rebuild; allowed to fail without blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  smoke:
    # B-015: the Linux AppImage shipped a broken pty.node (#456) and Windows
    # bridges rot silently (#475) because nothing ever spawned a real PTY per
    # OS. Matrix gate: natives load, PTY round-trips, clean exit — every push.
    name: Smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # NOTE: --ignore-scripts is deliberate. The repo postinstall rebuilds
      # natives for the ELECTRON ABI, which plain node cannot load — and on
      # Windows runners the rebuild toolchain detection fails outright (node-gyp
      # cannot find VS there; `npm ci` itself errors). Verified instead:
      # better-sqlite3 ships NO prebuilds and node-pty ships none for linux,
      # so every platform compiles for PLAIN node here (ubuntu/macOS toolchains
      # are preinstalled; Windows uses its VS2022 via npm's node-gyp). The
      # Electron-ABI rebuild path stays covered by the Build job + postinstall
      # on dev machines.
      - name: Install dependencies (no postinstall rebuild)
        run: npm ci --ignore-scripts
      - name: Compile natives for plain node
        run: npm rebuild node-pty better-sqlite3
      - name: PTY smoke (natives + round-trip + exit)
        run: npm run smoke
